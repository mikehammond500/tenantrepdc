<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Property Survey · Tenant Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/survey.css">
<link rel="icon" href="/img/favicon.svg">
</head>
<body>
<header class="brandbar">
  <a class="logo" id="logoLink" href="https://www.tenantconsulting.com" target="_blank" rel="noopener"><img src="/img/logo.svg" alt="Tenant Consulting"></a>
  <div class="hdr-title">
    <div class="eyebrow" id="clientLine">Property Survey</div>
    <h1 class="serif" id="surveyTitle">Loading…</h1>
  </div>
  <div class="tally" id="tally"></div>
</header>
<main class="layout">
  <aside class="side" id="side">
    <section id="listView">
      <div class="side-head">
        <div class="intro muted">Tap a building to see its available suites. Give each one a <b>thumbs up</b> or <b>thumbs down</b>; your picks are saved automatically.</div>
        <div class="filters" role="tablist" id="filters">
          <button data-f="all" class="on">All</button>
          <button data-f="up">Liked</button>
          <button data-f="down">Passed</button>
          <button data-f="none">Not rated</button>
        </div>
      </div>
      <ol class="cards" id="cards"></ol>
      <div class="contact" id="contact"></div>
    </section>
    <section id="detailView" hidden></section>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend"><span><i class="dot n"></i>Not rated</span><span><i class="dot u"></i>Liked</span><span><i class="dot d"></i>Passed</span></div>
    <button class="btn small fitbtn" id="fitBtn" title="Show all buildings">Show all</button>
  </div>
</main>
<div class="lightbox" id="lightbox" hidden><button class="lb-close" aria-label="Close">×</button><div class="lb-cap" id="lbCap"></div><img id="lbImg" alt=""></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/config.js"></script>
<script src="/js/survey.js"></script>
</body>
</html>
